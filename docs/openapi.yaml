openapi: 3.0.3
info:
  title: StrategyOS - Goals Domain API
  description: |
    Production-grade enterprise API specification for the StrategyOS Goals Domain.
    This module implements Vertical Slice Architecture with CQRS commands/queries,
    PostgreSQL persistence, Redis-backed dashboard caching, and Qdrant semantic memory alignment.
  version: 1.0.0
servers:
  - url: /api
    description: StrategyOS Gateway Node API Base Route
paths:
  /goals:
    get:
      summary: Retrieve Goal Aggregates
      description: Returns a list of all strategic goals, supporting category/type and priority query filtering.
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [Business, Personal, Family, Spiritual, Waqf, Financial]
        - name: priority
          in: query
          required: false
          schema:
            type: string
            enum: [Low, Medium, High, Highest, Critical]
      responses:
        '200':
          description: A list of goals.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Goal'
    post:
      summary: Provision New Goal Aggregate
      description: Validates and creates a new Goal aggregate. Triggers asynchronous AI Purpose Alignment scoring.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalInput'
      responses:
        '201':
          description: Goal aggregate successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '400':
          description: Invariant error or invalid input format.

  /goals/dashboard:
    get:
      summary: Get Dashboard Metrics
      description: Retrieves aggregate statistics of the Goals domain. Caching is managed via Redis cacheStore with self-invalidating publishers.
      responses:
        '200':
          description: Consolidated metrics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: object
                    properties:
                      total:
                        type: integer
                      active:
                        type: integer
                      paused:
                        type: integer
                      completed:
                        type: integer
                      avgProgress:
                        type: integer

  /goals/timeline:
    get:
      summary: Get Chronological Goals Timeline
      description: Returns goals sorted chronologically by target delivery date.
      responses:
        '200':
          description: Sorted timeline representation.

  /goals/search:
    get:
      summary: Semantic Similarity Memory Search
      description: Queries the Qdrant Vector database using neural embeddings to retrieve semantically matching goals.
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of semantically close matching goal records with confidence scores.

  /goals/{id}:
    get:
      summary: Get Detailed Goal Aggregate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detailed Goal representation.
        '404':
          description: Goal aggregate not found.
    put:
      summary: Update Goal Details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                progress:
                  type: integer
                milestones:
                  type: array
                  items:
                    $ref: '#/components/schemas/Milestone'
      responses:
        '200':
          description: Updated Goal aggregate.

    delete:
      summary: Delete Goal Aggregate
      description: Deletes the specified goal. Guard checks prevent deleting any goal with active dependents.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Goal successfully purged.
        '400':
          description: Invariant error - active dependencies found.

  /goals/{id}/complete:
    post:
      summary: Complete Goal Aggregate
      description: Transition status to Completed. Validates that all mandatory milestones are fully checked.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully completed.
        '400':
          description: Invariant error - unfinished mandatory milestones exist.

  /goals/{id}/pause:
    post:
      summary: Pause Goal tracking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Goal status transitioned to Paused.

  /goals/{id}/resume:
    post:
      summary: Resume Paused Goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Goal status transitioned to Active.

  /goals/{id}/archive:
    post:
      summary: Archive Goal Aggregate
      description: Archives active or completed goal records for cold storage.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Goal status transitioned to Archived.

components:
  schemas:
    Goal:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
        priority:
          type: string
        status:
          type: string
        progress:
          type: integer
        targetDate:
          type: string
        smartDefinition:
          type: string
        okrObjective:
          type: string
        kpis:
          type: array
          items:
            type: string
        northStar:
          type: string
        risk:
          type: string
        dependencies:
          type: array
          items:
            type: string
        purpose:
          type: string
        tags:
          type: array
          items:
            type: string
        notes:
          type: string
        milestones:
          type: array
          items:
            $ref: '#/components/schemas/Milestone'
        purposeAlignmentScore:
          type: integer
        aiForecast:
          type: string
        aiRecommendations:
          type: string
        owner:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string

    Milestone:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        completed:
          type: boolean
        mandatory:
          type: boolean

    CreateGoalInput:
      type: object
      required:
        - title
        - type
        - priority
        - targetDate
      properties:
        title:
          type: string
        type:
          type: string
        priority:
          type: string
        targetDate:
          type: string
        smartDefinition:
          type: string
        okrObjective:
          type: string
        kpis:
          type: array
          items:
            type: string
        northStar:
          type: string
        risk:
          type: string
        dependencies:
          type: array
          items:
            type: string
        purpose:
          type: string
        tags:
          type: array
          items:
            type: string
        notes:
          type: string
        milestones:
          type: array
          items:
            $ref: '#/components/schemas/Milestone'
